name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  CI: 'true'
  DATABASE_URL: 'postgresql://postgres:postgres@127.0.0.1:5432/postgres?schema=public'

jobs:
  lint:
    name: CI / Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --prefer-offline --fund=false
      - run: npm run lint

  typecheck:
    name: CI / Type Check
    runs-on: ubuntu-latest
    continue-on-error: true
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --prefer-offline --fund=false
      - run: npm run type-check

  build:
    name: CI / Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --prefer-offline --fund=false
      - run: npm run build

  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --prefer-offline --fund=false
      - run: npm test -- --ci --reporters=default --reporters=github-actions || true

name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

  api_check:
    runs-on: ubuntu-latest
    needs: build
    env:
      CLI_HEALTH_TOKEN: ${{ secrets.CLI_HEALTH_TOKEN }}
      OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
      ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
      GOOGLE_KEY: ${{ secrets.GOOGLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Build Next.js
        run: npm run build

      - name: Start Next.js server
        run: npm run start &

      - name: Wait for server
        run: npx wait-on http://localhost:3000

      - name: Run SDK API checks
        run: APP_URL=http://localhost:3000 node scripts/sdk-api-check.mjs

      - name: Provider health with transient keys (POST)
        if: ${{ env.CLI_HEALTH_TOKEN != '' }}
        run: |
          curl -s -X POST "http://localhost:3000/api/provider-health?token=${CLI_HEALTH_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "{\"openai\":\"${OPENAI_KEY}\",\"anthropic\":\"${ANTHROPIC_KEY}\",\"google\":\"${GOOGLE_KEY}\"}" | tee provider-health.json
          cat provider-health.json | jq -e '.ok == true'

  e2e:
    runs-on: ubuntu-latest
    needs: api_check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Build Next.js
        run: npm run build

      - name: Start Next.js server
        run: npm run start &

      - name: Wait for server
        run: npx wait-on http://localhost:3000

      - name: Run Playwright tests
        run: APP_URL=http://localhost:3000 npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report


